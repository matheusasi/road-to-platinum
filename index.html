<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Road to Platinum</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #050914;
    background-image: radial-gradient(circle at 88% 12%, rgba(46,142,255,0.10), transparent 42%),
                       radial-gradient(circle at 8% 92%, rgba(0,217,192,0.06), transparent 38%);
    color: #eaf1ff;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
  }

  /* =======================================================================
     SLIDES — cada dashboard e um ".slide" empilhado no mesmo lugar. Um timer
     (ver JS) alterna qual esta ".ativo". Isso troca de dashboard SEM navegar,
     entao o fullscreen nunca cai. position:absolute empilha todos no mesmo
     espaco; opacity + visibility fazem o fade (com fallback pro snap seco caso
     o navegador da TV nao suporte transition).
     ======================================================================= */
  .slide {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    opacity: 0;
    visibility: hidden;
    -webkit-transition: opacity 0.6s ease;
    transition: opacity 0.6s ease;
  }

  .slide.ativo {
    opacity: 1;
    visibility: visible;
  }

  #btnTelaCheia {
    position: fixed;
    right: 22px;
    top: 22px;
    z-index: 50;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background-color: rgba(13, 20, 36, 0.55);
    border: 1px solid rgba(46, 142, 255, 0.35);
    color: #8a9bc0;
    display: block;
    text-align: center;
    line-height: 44px;
    opacity: 0.35;
    cursor: pointer;
    -webkit-transition: opacity 0.3s ease;
    transition: opacity 0.3s ease;
  }

  #btnTelaCheia svg {
    vertical-align: middle;
  }

  #btnTelaCheia:hover {
    opacity: 1;
    color: #eaf1ff;
  }

  #btnTelaCheia.oculto {
    display: none;
  }

  #topo {
    text-align: center;
    padding: 26px 20px 6px 20px;
  }

  #topo h1 {
    margin: 0;
    font-size: 46px;
    letter-spacing: 2px;
    color: #f5f8ff;
    text-transform: uppercase;
  }

  #topo .subtitulo {
    margin-top: 6px;
    font-size: 20px;
    color: #7c8fb3;
  }

  #areaGauge {
    text-align: center;
    padding-top: 6px;
  }

  #textoGaugeCentro {
    margin-top: -70px;
    font-size: 64px;
    font-weight: bold;
    color: #f5f8ff;
  }

  #textoGaugeValores {
    margin-top: 6px;
    font-size: 26px;
    color: #8a9bc0;
  }

  #textoGaugeValores .atual { color: #29e0c8; font-weight: bold; }
  #textoGaugeValores .meta  { color: #f5f8ff; font-weight: bold; }

  #grade {
    padding: 10px 40px 20px 40px;
  }

  .card {
    background-color: #0d1424;
    border: 2px solid rgba(46,142,255,0.25);
    border-radius: 16px;
    width: 22%;
    margin: 1.5%;
    padding: 24px 10px;
    float: left;
    box-sizing: border-box;
    text-align: center;
    box-shadow: 0 0 24px rgba(46,142,255,0.08);
  }

  .card .rotulo {
    font-size: 22px;
    color: #7c8fb3;
    margin-bottom: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .card .valor {
    font-size: 42px;
    font-weight: bold;
    color: #eaf1ff;
    white-space: nowrap;
  }

  .card .valor.sucesso  { color: #3ddc84; }
  .card .valor.alerta   { color: #ff6b6b; }
  .card .valor.atencao  { color: #ffb648; }
  .card .valor.neutro   { color: #eaf1ff; }
  .card .valor.encerrado { font-size: 30px; color: #7c8fb3; }

  .clearfix { clear: both; }

  /* =======================================================================
     SLIDE 2 — Vendas de Cursos (Eduzz + Digital Manager Guru)
     Mesma paleta do slide 1. Layout em float de proposito: o navegador da
     TV e de 2014 e flexbox nele e imprevisivel.
     ======================================================================= */
  #topoVendas {
    text-align: center;
    padding: 26px 20px 6px 20px;
  }

  #topoVendas h1 {
    margin: 0;
    font-size: 52px;
    letter-spacing: 2px;
    color: #f5f8ff;
    text-transform: uppercase;
  }

  #topoVendas .subtitulo {
    margin-top: 6px;
    font-size: 24px;
    color: #7c8fb3;
  }

  #vendasResumo {
    padding: 14px 34px 0 34px;
  }

  .blocoVendas {
    background-color: #0d1424;
    border: 2px solid rgba(46,142,255,0.25);
    border-radius: 16px;
    box-shadow: 0 0 24px rgba(46,142,255,0.08);
    float: left;
    box-sizing: border-box;
    padding: 26px 30px;
    margin: 0 1%;
  }

  .blocoVendas.meta   { width: 48%; margin-left: 0; }
  .blocoVendas.metade { width: 23%; text-align: center; }
  .blocoVendas.metade:last-of-type { margin-right: 0; }

  .blocoVendas .rotulo {
    font-size: 22px;
    color: #7c8fb3;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }

  .blocoVendas .valor {
    font-size: 58px;
    font-weight: bold;
    color: #eaf1ff;
    white-space: nowrap;
  }

  .blocoVendas .valorGrande {
    font-size: 70px;
    font-weight: bold;
    color: #29e0c8;
    white-space: nowrap;
  }

  /* barra de progresso do faturamento contra a meta */
  .barraFundo {
    margin-top: 16px;
    height: 22px;
    border-radius: 11px;
    background-color: #111a2e;
    overflow: hidden;
  }

  .barraProgresso {
    height: 100%;
    width: 0;
    border-radius: 11px;
    background-color: #2e8eff;
  }

  .metaLegenda {
    margin-top: 12px;
    font-size: 22px;
    color: #8a9bc0;
  }

  .metaLegenda b { color: #eaf1ff; }

  #vendasBaixo {
    padding: 24px 34px 20px 34px;
  }

  .painelVendas {
    background-color: #0d1424;
    border: 2px solid rgba(46,142,255,0.25);
    border-radius: 16px;
    box-shadow: 0 0 24px rgba(46,142,255,0.08);
    float: left;
    box-sizing: border-box;
    padding: 22px 26px;
  }

  #painelGrafico { width: 56%; margin-right: 2%; }
  #painelTabela  { width: 42%; }

  .tituloSecao {
    font-size: 22px;
    color: #7c8fb3;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 14px;
  }

  #tabelaCursos {
    width: 100%;
    border-collapse: collapse;
    font-size: 26px;
  }

  #tabelaCursos td {
    padding: 13px 6px;
    border-bottom: 1px solid rgba(46,142,255,0.12);
    color: #eaf1ff;
  }

  #tabelaCursos td.qtd {
    text-align: center;
    color: #8a9bc0;
    width: 72px;
    white-space: nowrap;
  }

  #tabelaCursos td.fat {
    text-align: right;
    color: #29e0c8;
    font-weight: bold;
    white-space: nowrap;
    width: 168px;
  }

  #tabelaCursos td.nome {
    overflow: hidden;
    white-space: nowrap;
  }

  #tabelaCursos tr.vazio td {
    color: #7c8fb3;
    text-align: center;
    border-bottom: 0;
    padding-top: 22px;
  }

  /* O slide 2 foi dimensionado pra TV 1080p. Se a tela for mais baixa
     (720p, ou janela reduzida), encolhe tudo pra nao cortar o rodape. */
  @media (max-height: 850px) {
    #topoVendas { padding: 14px 20px 2px 20px; }
    #topoVendas h1 { font-size: 34px; }
    #topoVendas .subtitulo { font-size: 17px; }
    #vendasResumo { padding: 8px 24px 0 24px; }
    .blocoVendas { padding: 14px 18px; }
    .blocoVendas .rotulo { font-size: 15px; margin-bottom: 6px; }
    .blocoVendas .valor { font-size: 34px; }
    .blocoVendas .valorGrande { font-size: 40px; }
    .barraFundo { margin-top: 9px; height: 14px; border-radius: 7px; }
    .barraProgresso { border-radius: 7px; }
    .metaLegenda { margin-top: 7px; font-size: 15px; }
    #vendasBaixo { padding: 12px 24px 12px 24px; }
    .painelVendas { padding: 12px 16px; }
    .tituloSecao { font-size: 15px; margin-bottom: 8px; }
    #tabelaCursos { font-size: 17px; }
    #tabelaCursos td { padding: 6px 4px; }
    #tabelaCursos td.qtd { width: 48px; }
    #tabelaCursos td.fat { width: 110px; }
  }
</style>
</head>
<body>

  <!-- ===================================================================
       SLIDE 1 — Road to Platinum. Comeca ".ativo" (primeiro a aparecer).
       =================================================================== -->
  <div class="slide ativo" data-slide="road-to-platinum">

    <div id="topo">
      <h1>Road to Platinum</h1>
      <div class="subtitulo">Progresso dos ultimos 12 meses</div>
    </div>

    <div id="areaGauge">
      <canvas id="gauge" width="900" height="480"></canvas>
      <div id="textoGaugeCentro">0%</div>
      <div id="textoGaugeValores">
        Atual: <span class="atual" id="valGaugeAtual">$0</span>
        &nbsp;&nbsp;/&nbsp;&nbsp;
        Meta: <span class="meta" id="valGaugeMeta">$0</span>
      </div>
    </div>

    <div id="grade">

      <div class="card">
        <div class="rotulo">Dias sem Vender</div>
        <div class="valor atencao" id="valDiasSemVender">0</div>
      </div>

      <div class="card">
        <div class="rotulo">Faltava Ontem</div>
        <div class="valor neutro" id="valFaltanteOntem">$0</div>
      </div>

      <div class="card">
        <div class="rotulo">Falta Hoje</div>
        <div class="valor neutro" id="valFaltanteHoje">$0</div>
      </div>

      <div class="card">
        <div class="rotulo">Necessario / Dia</div>
        <div class="valor neutro" id="valPorDia">$0</div>
      </div>

      <div class="clearfix"></div>
    </div>

  </div>

  <!-- ===================================================================
       SLIDE 2 — Vendas de Cursos (Eduzz + Digital Manager Guru).
       Os numeros vem prontos do n8n (VENDAS_URL): a TV nao faz conta.
       =================================================================== -->
  <div class="slide" data-slide="vendas-cursos">

    <div id="topoVendas">
      <h1>Vendas de Cursos</h1>
      <div class="subtitulo" id="vendasRotuloMes">&nbsp;</div>
    </div>

    <div id="vendasResumo">

      <div class="blocoVendas meta">
        <div class="rotulo">Faturamento do mes</div>
        <div class="valorGrande" id="vendasFaturamento">R$ 0</div>
        <div class="barraFundo"><div class="barraProgresso" id="vendasBarra"></div></div>
        <div class="metaLegenda">
          Meta: <b id="vendasMeta">R$ 0</b>
          &nbsp;&middot;&nbsp;
          <b id="vendasPercentual">0%</b> da meta
        </div>
      </div>

      <div class="blocoVendas metade">
        <div class="rotulo">Vendas no mes</div>
        <div class="valor" id="vendasQtd">0</div>
      </div>

      <div class="blocoVendas metade">
        <div class="rotulo">Ticket medio</div>
        <div class="valor" id="vendasTicket">R$ 0</div>
      </div>

      <div class="clearfix"></div>
    </div>

    <div id="vendasBaixo">

      <div class="painelVendas" id="painelGrafico">
        <div class="tituloSecao">Faturamento semanal</div>
        <canvas id="graficoSemanal" width="880" height="430"></canvas>
      </div>

      <div class="painelVendas" id="painelTabela">
        <div class="tituloSecao">Cursos &mdash; mes atual</div>
        <table id="tabelaCursos"><tbody id="corpoTabelaCursos"></tbody></table>
      </div>

      <div class="clearfix"></div>
    </div>

  </div>

  <!-- ===================================================================
       Pra adicionar um terceiro dashboard, cole outro bloco assim (sem a
       classe "ativo" — so o primeiro comeca ativo). A rotacao pega
       sozinha, nao precisa mexer no JS:

       <div class="slide" data-slide="nome-do-novo"> ... </div>
       =================================================================== -->

  <!-- ===================================================================
       Botao sutil pra entrar em fullscreen. Fica fixo no canto, por cima
       dos slides. O clique nele conta como "gesto do usuario" — que e o
       que o navegador exige pra permitir requestFullscreen. Some sozinho
       quando ja esta em tela cheia.
       =================================================================== -->
  <div id="btnTelaCheia" title="Tela cheia">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path>
    </svg>
  </div>

<script>
  // =========================================================================
  // CONFIGURACAO
  //
  // O prazo (25/dez/2026) e o calculo de dias uteis restantes agora vivem
  // no workflow do n8n, nao aqui — mude por la se o prazo mudar.
  // =========================================================================

  var META_RECEITA = 750000; // USD

  // Quantos segundos cada dashboard fica na tela antes de trocar pro proximo.
  var SEGUNDOS_POR_SLIDE = 15;

  // =========================================================================
  // FONTES DE DADOS
  //
  // Este repositorio e PUBLICO (necessario pra ativar o GitHub Pages de
  // graca), entao numero de venda NUNCA fica gravado aqui. Tudo mora no
  // monday.com e e servido por webhooks do n8n, que ja fazem as contas e
  // devolvem so o JSON pronto — o dashboard busca direto de la, entre
  // origens (CORS), sem passar pelo GitHub.
  //
  // Usa XMLHttpRequest em vez de fetch() de proposito: navegadores de Smart
  // TV antigos (ex: Tizen 2014) costumam nao ter fetch()/Promise nativos.
  // =========================================================================

  var URL_ROAD_TO_PLATINUM = 'https://n8n-xymb.srv1709744.hstgr.cloud/webhook/road-to-platinum';
  var URL_VENDAS_CURSOS    = 'https://n8n-xymb.srv1709744.hstgr.cloud/webhook/vendas-cursos';

  function buscarJSON(url, callback) {
    var xhr = new XMLHttpRequest();
    // cache-bust: sem isso, o navegador pode servir uma resposta antiga
    // em vez de buscar a mais recente do webhook
    xhr.open('GET', url + '?_=' + new Date().getTime(), true);
    xhr.onreadystatechange = function () {
      if (xhr.readyState === 4) {
        if (xhr.status === 200) {
          try {
            callback(JSON.parse(xhr.responseText));
          } catch (erroParse) {
            if (window.console && console.error) console.error('Resposta invalida de ' + url, erroParse);
          }
        } else {
          if (window.console && console.error) console.error('Falha ao buscar ' + url + ', status:', xhr.status);
        }
      }
    };
    xhr.send();
  }

  function buscarDados(callback) {
    buscarJSON(URL_ROAD_TO_PLATINUM, callback);
  }

  // =========================================================================
  // UTILITARIOS
  //
  // Nota de compatibilidade: este arquivo evita de proposito recursos de JS
  // recentes (arrow functions, async/await, const/let, fetch, Promise nativa)
  // porque o alvo declarado e um navegador de Smart TV de 2014 (Tizen), que
  // nao suporta a maior parte disso — um erro de sintaxe nesses recursos
  // quebraria a pagina inteira, nao so a parte que os usa. Intl.NumberFormat
  // e Wake Lock sao usados quando o navegador suporta, com fallback manual
  // quando nao suporta.
  // =========================================================================

  var formatadorUSD = null;
  if (window.Intl && window.Intl.NumberFormat) {
    try {
      formatadorUSD = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
    } catch (e) {
      formatadorUSD = null;
    }
  }

  function formatarUSD(valor) {
    if (formatadorUSD) {
      return formatadorUSD.format(valor);
    }
    // fallback manual (sem Intl): separador de milhar na mao, sem centavos
    var inteiro = String(Math.round(valor));
    var negativo = inteiro.charAt(0) === '-';
    if (negativo) inteiro = inteiro.substring(1);
    var invertido = inteiro.split('').reverse().join('');
    var comVirgulas = invertido.replace(/(\d{3})(?=\d)/g, '$1,');
    var resultado = comVirgulas.split('').reverse().join('');
    return (negativo ? '-$' : '$') + resultado;
  }

  // =========================================================================
  // GAUGE (semicirculo) — desenhado em Canvas, sem depender de imagens/SVG
  // =========================================================================

  function corDoGauge(pct) {
    if (pct >= 1) return '#00d9c0';
    if (pct >= 0.6) return '#4da8ff';
    if (pct >= 0.3) return '#ffb648';
    return '#ff6b6b';
  }

  function desenharGauge(pct) {
    var canvas = document.getElementById('gauge');
    var ctx = canvas.getContext('2d');
    var w = canvas.width;
    var h = canvas.height;
    var cx = w / 2;
    var cy = h * 0.92;
    var raio = Math.min(w / 2, h) * 0.8;
    var espessura = 46;

    ctx.clearRect(0, 0, w, h);

    // trilha de fundo
    ctx.beginPath();
    ctx.arc(cx, cy, raio, Math.PI, 0, false);
    ctx.lineWidth = espessura;
    ctx.strokeStyle = '#111a2e';
    ctx.lineCap = 'round';
    ctx.stroke();

    // progresso
    var pctClamp = pct;
    if (pctClamp < 0) pctClamp = 0;
    if (pctClamp > 1) pctClamp = 1;

    if (pctClamp > 0) {
      var anguloFim = Math.PI + pctClamp * Math.PI;
      ctx.beginPath();
      ctx.arc(cx, cy, raio, Math.PI, anguloFim, false);
      ctx.lineWidth = espessura;
      ctx.strokeStyle = corDoGauge(pctClamp);
      ctx.lineCap = 'round';
      ctx.stroke();
    }
  }

  // =========================================================================
  // RENDERIZACAO
  // =========================================================================

  function corPorDiasSemVender(dias) {
    if (dias >= 3) return 'alerta';   // vermelho
    if (dias >= 1) return 'atencao';  // amarelo (1 ou 2 dias)
    return 'sucesso';                 // verde (0 dias)
  }

  function renderizarDashboard(dados) {
    var pct = dados.receitaAtual / META_RECEITA;
    var pctExibicao = Math.round(pct * 1000) / 10; // 1 casa decimal

    desenharGauge(pct);
    document.getElementById('textoGaugeCentro').innerHTML = pctExibicao + '%';
    document.getElementById('valGaugeAtual').innerHTML = formatarUSD(dados.receitaAtual);
    document.getElementById('valGaugeMeta').innerHTML = formatarUSD(META_RECEITA);

    // Cor guiada so pelos Dias sem Vender — "Dias sem Vender" e "Falta Hoje"
    // usam a MESMA cor: 0 dias = verde, 1-2 = amarelo, 3+ = vermelho (e fica
    // vermelho pra frente ate alguem registrar venda e zerar os dias).
    var classeCor = corPorDiasSemVender(dados.diasSemVender);

    var elDias = document.getElementById('valDiasSemVender');
    elDias.innerHTML = dados.diasSemVender;
    elDias.className = 'valor ' + classeCor;

    document.getElementById('valFaltanteOntem').innerHTML = formatarUSD(dados.receitaFaltanteOntem);

    var elFaltaHoje = document.getElementById('valFaltanteHoje');
    elFaltaHoje.innerHTML = formatarUSD(dados.receitaFaltanteHoje);
    elFaltaHoje.className = 'valor ' + classeCor;

    var elPorDia = document.getElementById('valPorDia');
    if (dados.receitaFaltanteHoje <= 0) {
      elPorDia.innerHTML = 'Meta atingida';
      elPorDia.className = 'valor encerrado';
    } else {
      elPorDia.innerHTML = formatarUSD(dados.necessarioPorDia);
      elPorDia.className = 'valor neutro';
    }
  }

  // =========================================================================
  // SLIDE 2 — VENDAS DE CURSOS
  //
  // O n8n manda tudo mastigado (faturamento do mes, meta, ticket medio,
  // serie semanal e tabela por curso). Aqui so pinta na tela.
  // =========================================================================

  var formatadorBRL = null;
  if (window.Intl && window.Intl.NumberFormat) {
    try {
      formatadorBRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
    } catch (e) {
      formatadorBRL = null;
    }
  }

  function formatarBRL(valor) {
    if (formatadorBRL) return formatadorBRL.format(valor);
    // fallback manual (sem Intl): milhar com ponto, igual ao padrao br
    var inteiro = String(Math.round(valor));
    var negativo = inteiro.charAt(0) === '-';
    if (negativo) inteiro = inteiro.substring(1);
    var invertido = inteiro.split('').reverse().join('');
    var comPontos = invertido.replace(/(\d{3})(?=\d)/g, '$1.');
    return (negativo ? '-R$ ' : 'R$ ') + comPontos.split('').reverse().join('');
  }

  function desenharGraficoSemanal(semanas) {
    var canvas = document.getElementById('graficoSemanal');
    if (!canvas || !canvas.getContext) return;

    // O canvas precisa caber no painel, que e uma porcentagem da tela — numa
    // TV 1080p ou numa janela pequena a largura muda. Sem isso o grafico
    // vaza por cima do painel da tabela.
    var painel = document.getElementById('painelGrafico');
    if (painel && painel.clientWidth > 0) {
      var disponivel = painel.clientWidth - 44; // desconta o padding do painel
      if (disponivel > 100 && canvas.width !== disponivel) canvas.width = disponivel;
    }
    // a altura vem de atributo HTML, que o CSS do @media nao encolhe —
    // entao acompanha aqui o mesmo corte de 850px usado no CSS
    var alturaAlvo = (window.innerHeight <= 850) ? 220 : 430;
    if (canvas.height !== alturaAlvo) canvas.height = alturaAlvo;

    var ctx = canvas.getContext('2d');
    var w = canvas.width;
    var h = canvas.height;

    ctx.clearRect(0, 0, w, h);
    if (!semanas || semanas.length === 0) return;

    var margemEsq = 12, margemDir = 12, margemTopo = 18, margemBaixo = 40;
    var largura = w - margemEsq - margemDir;
    var altura = h - margemTopo - margemBaixo;

    var maior = 0;
    var i;
    for (i = 0; i < semanas.length; i++) {
      if (semanas[i].total > maior) maior = semanas[i].total;
    }
    if (maior <= 0) maior = 1; // evita divisao por zero quando nao houve venda

    function coordX(indice) {
      if (semanas.length === 1) return margemEsq + largura / 2;
      return margemEsq + (largura * indice) / (semanas.length - 1);
    }
    function coordY(valor) {
      return margemTopo + altura - (altura * valor) / maior;
    }

    // linhas de grade horizontais
    ctx.strokeStyle = 'rgba(46,142,255,0.10)';
    ctx.lineWidth = 1;
    for (i = 0; i <= 3; i++) {
      var y = margemTopo + (altura * i) / 3;
      ctx.beginPath();
      ctx.moveTo(margemEsq, y);
      ctx.lineTo(w - margemDir, y);
      ctx.stroke();
    }

    // area sob a linha
    ctx.beginPath();
    ctx.moveTo(coordX(0), margemTopo + altura);
    for (i = 0; i < semanas.length; i++) {
      ctx.lineTo(coordX(i), coordY(semanas[i].total));
    }
    ctx.lineTo(coordX(semanas.length - 1), margemTopo + altura);
    ctx.closePath();
    ctx.fillStyle = 'rgba(46,142,255,0.14)';
    ctx.fill();

    // a linha
    ctx.beginPath();
    for (i = 0; i < semanas.length; i++) {
      var x = coordX(i);
      var yv = coordY(semanas[i].total);
      if (i === 0) ctx.moveTo(x, yv); else ctx.lineTo(x, yv);
    }
    ctx.strokeStyle = '#4da8ff';
    ctx.lineWidth = 3;
    ctx.stroke();

    // pontos
    for (i = 0; i < semanas.length; i++) {
      ctx.beginPath();
      ctx.arc(coordX(i), coordY(semanas[i].total), 4, 0, Math.PI * 2, false);
      ctx.fillStyle = '#29e0c8';
      ctx.fill();
    }

    // rotulos do eixo x (mostra 1 a cada 2 pra nao embolar na TV)
    ctx.fillStyle = '#7c8fb3';
    ctx.font = '19px Arial, Helvetica, sans-serif';
    ctx.textAlign = 'center';
    for (i = 0; i < semanas.length; i++) {
      if (i % 2 === 0 || i === semanas.length - 1) {
        ctx.fillText(semanas[i].rotulo, coordX(i), h - 12);
      }
    }
  }

  function renderizarVendas(dados) {
    document.getElementById('vendasRotuloMes').innerHTML = dados.rotuloMes || '&nbsp;';
    document.getElementById('vendasFaturamento').innerHTML = formatarBRL(dados.faturamentoMes);
    document.getElementById('vendasMeta').innerHTML = formatarBRL(dados.metaMensal);
    document.getElementById('vendasPercentual').innerHTML = dados.percentualMeta + '%';
    document.getElementById('vendasQtd').innerHTML = dados.vendasMes;
    document.getElementById('vendasTicket').innerHTML = formatarBRL(dados.ticketMedio);

    var pct = dados.percentualMeta;
    if (pct < 0) pct = 0;
    if (pct > 100) pct = 100;
    var barra = document.getElementById('vendasBarra');
    barra.style.width = pct + '%';
    // mesma escala de cor do gauge do slide 1, pra leitura ficar consistente
    barra.style.backgroundColor = corDoGauge(dados.percentualMeta / 100);

    desenharGraficoSemanal(dados.semanal);

    var corpo = document.getElementById('corpoTabelaCursos');
    var html = '';
    var cursos = dados.cursos || [];
    if (cursos.length === 0) {
      html = '<tr class="vazio"><td colspan="3">Nenhuma venda registrada neste mes</td></tr>';
    } else {
      // cabe cerca de 7 linhas no painel da TV sem cortar
      var limite = cursos.length > 7 ? 7 : cursos.length;
      for (var i = 0; i < limite; i++) {
        var c = cursos[i];
        html += '<tr>' +
                  '<td class="qtd">' + c.vendas + 'x</td>' +
                  '<td class="nome">' + c.curso + '</td>' +
                  '<td class="fat">' + formatarBRL(c.faturamento) + '</td>' +
                '</tr>';
      }
      if (cursos.length > limite) {
        var resto = 0;
        for (var j = limite; j < cursos.length; j++) resto += cursos[j].faturamento;
        html += '<tr>' +
                  '<td class="qtd">&nbsp;</td>' +
                  '<td class="nome">+ ' + (cursos.length - limite) + ' outros cursos</td>' +
                  '<td class="fat">' + formatarBRL(resto) + '</td>' +
                '</tr>';
      }
    }
    corpo.innerHTML = html;
  }

  // =========================================================================
  // REQUISITO 2 — auto-refresh dos dados a cada 1 minuto, sem reload de pagina
  //
  // Este e o mecanismo PRINCIPAL de atualizacao. Um reload completo derruba
  // o fullscreen (nenhum navegador preserva fullscreen atraves de uma
  // navegacao real, nem o da TV) e, depois de recarregar, requestFullscreen()
  // exige um gesto do usuario pra funcionar de novo — que a TV nao tem
  // sozinha. Por isso a atualizacao de dados normal NUNCA navega: so troca o
  // texto na tela via XHR.
  // =========================================================================

  var ultimoSucesso = Date.now();

  function atualizarDados() {
    buscarDados(function (dados) {
      ultimoSucesso = Date.now();
      renderizarDashboard(dados);
    });
  }

  function atualizarVendas() {
    buscarJSON(URL_VENDAS_CURSOS, function (dados) {
      // de proposito NAO mexe em ultimoSucesso: o watchdog de reload existe
      // pra destravar a pagina, e o slide 1 e a fonte de verdade disso. Se so
      // o webhook de vendas cair, nao vale recarregar (e perder o fullscreen).
      renderizarVendas(dados);
    });
  }

  atualizarDados();
  atualizarVendas();
  setInterval(atualizarDados, 1 * 60 * 1000);
  setInterval(atualizarVendas, 1 * 60 * 1000);

  // =========================================================================
  // ROTACAO DE DASHBOARDS (slides)
  //
  // Alterna qual ".slide" esta ".ativo" num ciclo, a cada SEGUNDOS_POR_SLIDE.
  // Nao navega nem recarrega — so troca a classe CSS — entao o fullscreen
  // continua intacto. Os dados do Road to Platinum seguem se atualizando por
  // baixo mesmo com o slide escondido, entao quando ele volta ja esta fresco.
  //
  // Pra adicionar mais um dashboard: crie outro <div class="slide"> no HTML.
  // Este codigo pega todos automaticamente, sem precisar mudar nada aqui.
  // =========================================================================

  var slides = document.getElementsByClassName('slide');
  var slideAtual = 0;

  function trocarSlide() {
    if (slides.length < 2) return; // com 1 so nao ha o que rotacionar
    slides[slideAtual].className = 'slide';
    slideAtual = (slideAtual + 1) % slides.length;
    slides[slideAtual].className = 'slide ativo';
  }

  setInterval(trocarSlide, SEGUNDOS_POR_SLIDE * 1000);

  // =========================================================================
  // REQUISITO 3 — reload completo APENAS se os dados pararem de atualizar.
  //
  // Nao existe mais reload programado por horario: todo reload sai do
  // fullscreen na TV (nenhum navegador re-entra em fullscreen sozinho depois
  // de uma navegacao, nem o dela) e a TV nao tem controle remoto por perto pra
  // tocar na tela de novo. Entao so recarrega em ULTIMO CASO: se 5 minutos
  // se passarem sem nenhuma atualizacao de dados bem-sucedida (sinal de que o
  // JS realmente travou), ai sim vale a pena pagar o preco de perder o
  // fullscreen pra sair do estado travado.
  // =========================================================================

  setInterval(function () {
    if (Date.now() - ultimoSucesso > 5 * 60 * 1000) {
      location.reload();
    }
  }, 1 * 60 * 1000);

  // =========================================================================
  // REQUISITO 4 — Wake Lock (manter tela ativa), quando suportado
  // =========================================================================

  function manterTelaAtiva() {
    if (navigator.wakeLock && navigator.wakeLock.request) {
      try {
        navigator.wakeLock.request('screen')['catch'](function () {
          // sem problema se falhar (ex: TV sem suporte real, so a API presente)
        });
      } catch (erro) {
        // sem problema se o navegador da TV nao suportar
      }
    }
  }

  manterTelaAtiva();

  // =========================================================================
  // REQUISITO 5 — auto-recuperacao de erro (recarrega sozinho se travar)
  // =========================================================================

  window.addEventListener('error', function () {
    setTimeout(function () {
      location.reload();
    }, 5000);
  });

  // =========================================================================
  // REQUISITO 1 — fullscreen automatico, com fallback pro primeiro clique/toque
  // =========================================================================

  function pedirTelaCheia() {
    var el = document.documentElement;
    var metodo = el.requestFullscreen ||
                 el.webkitRequestFullscreen ||
                 el.webkitRequestFullScreen ||
                 el.mozRequestFullScreen ||
                 el.msRequestFullscreen;

    if (!metodo) {
      armarFallbackDeClique();
      return;
    }

    try {
      var resultado = metodo.call(el);
      if (resultado && typeof resultado.then === 'function') {
        resultado['catch'](function () {
          armarFallbackDeClique();
        });
      }
    } catch (erro) {
      armarFallbackDeClique();
    }
  }

  function armarFallbackDeClique() {
    function aoClicar() {
      document.removeEventListener('click', aoClicar, false);
      pedirTelaCheia();
    }
    document.addEventListener('click', aoClicar, false);
  }

  window.addEventListener('load', function () {
    pedirTelaCheia();
    armarFallbackDeClique();
  });

  // =========================================================================
  // REQUISITO 6 — auto-recuperacao de fullscreen, caso saia por qualquer
  // motivo (nao so reload) sem ninguem por perto pra tocar na tela de novo.
  // =========================================================================

  function estaEmTelaCheia() {
    return !!(document.fullscreenElement ||
              document.webkitFullscreenElement ||
              document.mozFullScreenElement ||
              document.msFullscreenElement);
  }

  setInterval(function () {
    if (!estaEmTelaCheia()) {
      pedirTelaCheia();
    }
  }, 30 * 1000);

  // =========================================================================
  // BOTAO SUTIL DE TELA CHEIA
  //
  // O clique aqui e um gesto explicito do usuario, que e exatamente o que o
  // navegador exige pra deixar entrar em fullscreen (o pedido automatico no
  // load costuma ser bloqueado sem esse gesto). O botao some quando ja esta
  // em tela cheia e reaparece se sair.
  // =========================================================================

  var btnTelaCheia = document.getElementById('btnTelaCheia');

  if (btnTelaCheia) {
    btnTelaCheia.onclick = function () {
      pedirTelaCheia();
    };
  }

  function atualizarVisibilidadeBotao() {
    if (!btnTelaCheia) return;
    btnTelaCheia.className = estaEmTelaCheia() ? 'oculto' : '';
  }

  atualizarVisibilidadeBotao();
  document.addEventListener('fullscreenchange', atualizarVisibilidadeBotao, false);
  document.addEventListener('webkitfullscreenchange', atualizarVisibilidadeBotao, false);
  document.addEventListener('mozfullscreenchange', atualizarVisibilidadeBotao, false);
  document.addEventListener('MSFullscreenChange', atualizarVisibilidadeBotao, false);
</script>

</body>
</html>
